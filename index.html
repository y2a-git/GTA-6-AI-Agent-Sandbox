 if(Math.floor(ao/B)!==Math.floor(an/B)){const k=Math.max(Math.floor(ao/B),Math.floor(an/B)),s=dx+dz,opts=[[dx,dz,0],[dx,dz,0],[dz,-dx,1],[-dz,dx,1]].sort(()=>Math.random()-.5);
  let ch=null;for(const o of opts){const sn=o[0]+o[1];const idx=o[2]?c.ln+sn:k+s;if(idx>=-N&&idx<=N){ch=o;break}}
  if(!ch)ch=[-dx,-dz,0];if(ch[2]){if(dx)c.x=k*B;else c.z=k*B;const old=c.ln;c.dir=[ch[0],ch[1]];c.ln=k}else if(ch[0]!==dx||ch[1]!==dz){c.dir=[ch[0],ch[1]]}}
 c.h+=wrap(Math.atan2(c.dir[0],c.dir[1])-c.h)*Math.min(1,dt*6)}
function policeAI(c,dt){const ex=P.x-(P.car?0:0),px=P.car?P.car.x:P.x,pz=P.car?P.car.z:P.z,d=Math.hypot(px-c.x,pz-c.z);
 if(!P.wanted){c.v*=1-dt*2;c.x+=Math.sin(c.h)*c.v*dt;c.z+=Math.cos(c.h)*c.v*dt;return}
 const a=d<40?[px,pz]:nav(c.x,c.z,px,pz),df=wrap(Math.atan2(a[0]-c.x,a[1]-c.z)-c.h);c.h+=clamp(df*2,-1,1)*2.6*dt*clamp(c.v/6,.3,1);
 const tv=(d<9?9:(Math.abs(df)>1?10:22+P.wanted*3.5));c.v+=clamp(tv-c.v,-25*dt,14*dt);c.x+=Math.sin(c.h)*c.v*dt;c.z+=Math.cos(c.h)*c.v*dt}
// ---------- input ----------
const keys={};let drag=false,camYaw=0,camMode=0,wantEnter=false,deadT=0,tod=.7,lock=null,ac,eng,engG;
const AI={on:true,cmd:'auto',stuck:0,rev:0,cd:0,pt:null};
addEventListener('keydown',e=>{if(e.target.id==='cmd'){if(e.key==='Enter')sendCmd();return}const k=e.key.toLowerCase();keys[k]=true;
 if(k==='tab'||k==='p'){e.preventDefault();AI.on=!AI.on;$('ai').textContent='AI AUTOPILOT: '+(AI.on?'ON':'OFF');$('ai').style.color=$('ai').style.borderColor=AI.on?'#19e68c':'#ff3d5e'}
 if(k==='f')wantEnter=true;if(k==='c')camMode=(camMode+1)%3;if(k==='r')respawn();if(k===' ')e.preventDefault();
 if(!ac){try{ac=new AudioContext();eng=ac.createOscillator();eng.type='sawtooth';const f=ac.createBiquadFilter();f.frequency.value=380;engG=ac.createGain();engG.gain.value=0;eng.connect(f);f.connect(engG);engG.connect(ac.destination);eng.start()}catch(_){}}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
R.domElement.addEventListener('pointerdown',()=>drag=true);addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(drag)camYaw-=e.movementX*.005});
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
function sendCmd(){const t=$('cmd').value.toLowerCase();$('cmd').value='';if(!t)return;

 else{AI.cmd=t.includes('steal')?'steal':t.includes('mission')?'mission':t.includes('evade')?'evade':t.includes('patrol')?'patrol':AI.cmd}
 AI.on=true;$('ai').textContent='AI AUTOPILOT: ON';$('cmd').blur()}
$('send').onclick=sendCmd;
function respawn(){if(P.car){P.car.type='parked'}P.car=null;P.x=0;P.z=14;P.armor=100;P.wanted=0;for(const c of cars)if(c.type==='police')c.type='parked'}
function enterExit(){if(P.car){const c=P.car;c.type='parked';P.x=c.x-Math.cos(c.h)*2.8;P.z=c.z+Math.sin(c.h)*2.8;P.car=null;return}
 const n=near(P.x,P.z,c=>c.type!=='player');if(n.c&&n.d<5){const c=n.c;if(c.type==='traffic')wantedUp(1);else if(c.type==='police')wantedUp(2);c.type='player';c.v=0;P.car=c}}
// ---------- agent ----------
function agent(dt){const px=P.car?P.car.x:P.x,pz=P.car?P.car.z:P.z,pol=near(px,pz,c=>c.type==='police'),bd=Math.hypot(beacon.position.x-px,beacon.position.z-pz);
 let m=AI.cmd;if(m==='auto')m=(P.wanted>0&&pol.d<110)?'evade':'mission';if(!P.car)m='steal';
 const out={thr:0,str:0,hb:false,mx:0,mz:0};let dec='',aim,lid='CLEAR';
 if(!P.car){const t=near(px,pz,c=>c.type!=='police'&&c.type!=='player');if(!t.c)return out;let best=t.c,bs=1e9;
  for(const c of cars){if(c.type==='police')continue;const s=Math.hypot(c.x-px,c.z-pz)+(c.type==='traffic'?25:0);if(s<bs){bs=s;best=c}}
  const d=Math.hypot(best.x-px,best.z-pz);aim=d<16?[best.x,best.z]:nav(px,pz,best.x,best.z);const l=Math.hypot(aim[0]-px,aim[1]-pz)||1;
  out.mx=(aim[0]-px)/l;out.mz=(aim[1]-pz)/l;out.run=true;if(d<3.6&&AI.cd<=0){wantEnter=true;AI.cd=1.5}
  dec='On foot; acquiring '+best.type+' vehicle '+d.toFixed(0)+'m away for rapid transit';
 }else{const c=P.car;let tx,tz,tvm=30;
  if(m==='evade'&&pol.c){const dx=px-pol.c.x,dz=pz-pol.c.z,l=Math.hypot(dx,dz)||1;tx=px+dx/l*160;tz=pz+dz/l*160;tvm=38;dec='Wanted '+P.wanted+'★ - evading police '+pol.d.toFixed(0)+'m behind'}
  else if(m==='patrol'){if(!AI.pt||Math.hypot(AI.pt[0]-px,AI.pt[1]-pz)<18)AI.pt=[ri(-N,N)*B,ri(-N,N)*B];tx=AI.pt[0];tz=AI.pt[1];dec='Patrolling city grid'}
  else{tx=beacon.position.x;tz=beacon.position.z;dec='Driving to mission beacon '+bd.toFixed(0)+'m ahead'}
  aim=Math.hypot(tx-px,tz-pz)<20?[tx,tz]:nav(px,pz,tx,tz);const df=wrap(Math.atan2(aim[0]-px,aim[1]-pz)-c.h);out.str=clamp(df*1.8,-1,1);
  let tv=clamp(tvm-Math.abs(df)*12,7,tvm);
  for(const o of cars){if(o===c)continue;const rx=o.x-px,rz=o.z-pz,f=rx*Math.sin(c.h)+rz*Math.cos(c.h),l=Math.abs(rx*Math.cos(c.h)-rz*Math.sin(c.h));if(f>0&&f<16&&l<3){tv=Math.min(tv,Math.max(0,(f-6)*1.6));lid='OBJECT '+f.toFixed(0)+'m'}}
  for(const q of peds){const rx=q.x-px,rz=q.z-pz,f=rx*Math.sin(c.h)+rz*Math.cos(c.h),l=Math.abs(rx*Math.cos(c.h)-rz*Math.sin(c.h));if(f>0&&f<14&&l<2.5){tv=Math.min(tv,Math.max(0,(f-5)*1.4));lid='PEDESTRIAN '+f.toFixed(0)+'m'}}
  out.thr=clamp((tv-c.v)*.5,-1,1);
  if(Math.abs(c.v)<1.2&&out.thr>.4){AI.stuck+=dt;if(AI.stuck>1.4){AI.rev=1.1;AI.stuck=0}}else AI.stuck=0;
  if(AI.rev>0){AI.rev-=dt;out.thr=-1;out.str=-out.str||1;lid='REVERSING'}}
 AI.cd-=dt;
 $('l1').textContent='[SENSE] Beacon: '+bd.toFixed(0)+'m | Police: '+(pol.c?pol.d.toFixed(0)+'m':'none')+' | Wanted: '+P.wanted;
 $('l2').textContent='[DECIDE] '+dec+'  ['+m+']';
 $('l3').textContent='[ACT] Heading '+((((P.car?P.car.h:P.h)*57.3)%360+360)%360).toFixed(0)+'° | Throttle '+(P.car?(P.car.v*2.237).toFixed(0):'walk')+' MPH | Lidar: '+lid;
 return out}
// ---------- update ----------
function update(dt){
 if(deadT>0){deadT-=dt;if(deadT<=0){$('msg').style.opacity=0;respawn()}return}
 tod=lock!==null?tod+(lock-tod)*Math.min(1,dt*.6):(tod+dt/360)%1;
 hitCd-=dt;const a=AI.on?agent(dt):null;
 if(wantEnter){wantEnter=false;enterExit()}
 if(P.car){const c=P.car;let thr,str,hb;if(a){thr=a.thr;str=a.str;hb=a.hb}else{thr=(keys.w?1:0)-(keys.s?1:0);str=(keys.a?1:0)-(keys.d?1:0);hb=keys[' ']}driveCar(c,thr,str,hb,dt);P.x=c.x;P.z=c.z}
 else{let mx,mz,sp;if(a){mx=a.mx;mz=a.mz;sp=a.run?8.5:5}else{const fw=(keys.w?1:0)-(keys.s?1:0),st=(keys.d?1:0)-(keys.a?1:0);mx=Math.sin(camYaw)*fw-Math.cos(camYaw)*st;mz=Math.cos(camYaw)*fw+Math.sin(camYaw)*st;sp=keys.shift?8.5:5}
  const l=Math.hypot(mx,mz);if(l>.01){mx/=l;mz/=l;P.x+=mx*sp*dt;P.z+=mz*sp*dt;P.h+=wrap(Math.atan2(mx,mz)-P.h)*Math.min(1,dt*12);P.walk+=dt*sp*1.6;P.ws=sp}else P.ws=0;pushOut(P,.5)}
 for(const c of cars){if(c.type==='traffic')trafficAI(c,dt);else if(c.type==='police')policeAI(c,dt);else if(c.type==='parked'&&Math.abs(c.v)>.1){c.v*=1-dt*2;c.x+=Math.sin(c.h)*c.v*dt;c.z+=Math.cos(c.h)*c.v*dt}
  if(pushOut(c,2)){if(c===P.car&&Math.abs(c.v)>10&&hitCd<=0){P.armor-=Math.abs(c.v)*.45;hitCd=.5}c.v*=.6}}
 for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const p=cars[i],q=cars[j],dx=q.x-p.x,dz=q.z-p.z,d=Math.hypot(dx,dz);
  if(d<3.8&&d>.01){const o=(3.8-d)/2,nx=dx/d,nz=dz/d;p.x-=nx*o;p.z-=nz*o;q.x+=nx*o;q.z+=nz*o;const rel=Math.abs(p.v-q.v);
   if(rel>5&&(p===P.car||q===P.car)&&hitCd<=0){const o2=p===P.car?q:p;P.armor-=rel*(o2.type==='police'?.9:.5);hitCd=.5;if(o2.type==='traffic'&&rel>9)wantedUp(1)}
   p.v*=.96;q.v*=.96}}
 if(!P.car)for(const c of cars)if(c.type!=='parked'&&Math.hypot(c.x-P.x,c.z-P.z)<2.2&&Math.abs(c.v)>5&&hitCd<=0){P.armor-=18;hitCd=.6;P.x+=Math.sin(c.h)*2;P.z+=Math.cos(c.h)*2}
 if(!P.car&&P.wanted){const n=near(P.x,P.z,c=>c.type==='police');if(n.d<4)P.armor-=8*dt}
 // police + traffic management
 const pc=cars.filter(c=>c.type==='police').length,want=P.wanted?Math.min(P.wanted+1,5):0;
 if(pc<want&&Math.random()<dt*1.2){for(let k=0;k<10;k++){const i=ri(-N,N)*B,j=ri(-N,N)*B,d=Math.hypot(i-P.x,j-P.z);if(d>110&&d<240){const c=addCar({x:i,z:j,type:'police',v:10});c.h=Math.atan2(P.x-i,P.z-j);break}}}
 for(let i=cars.length-1;i>=0;i--){const c=cars[i];if(c.type==='police'&&!P.wanted&&Math.hypot(c.x-P.x,c.z-P.z)>70||(c.type==='traffic'&&Math.hypot(c.x-P.x,c.z-P.z)>420)){scene.remove(c.m);cars.splice(i,1)}}
 if(cars.filter(c=>c.type==='traffic').length<30&&Math.random()<dt)spawnT(true);
 if(P.wanted){const n=near(P.x,P.z,c=>c.type==='police');if(n.d>75){evT+=dt;if(evT>9){P.wanted--;evT=0}}else evT=0}
 // mission
 if(Math.hypot(beacon.position.x-P.x,beacon.position.z-P.z)<8){P.missions++;P.armor=Math.min(100,P.armor+15);newBeacon()}
 if(P.armor<=0){deadT=2.5;$('msg').style.opacity=1}
 // meshes
 for(const c of cars){c.m.position.set(c.x,0,c.z);c.m.rotation.y=c.h;const b=c.m.userData.bar;if(b){const f=Math.floor(performance.now()/160)%2;b[0].visible=!f;b[1].visible=!!f}}
 man.visible=!P.car;man.position.set(P.x,0,P.z);man.rotation.y=P.h;P.amp+=(P.ws/5-P.amp)*Math.min(1,dt*10);animHuman(man,P.walk,P.amp,performance.now()/1000);updPeds(dt);
 beacon.material.opacity=.22+.08*Math.sin(performance.now()/300);
 // camera
 const tx=P.x,tz=P.z,sp=P.car?Math.abs(P.car.v):0;
 if(P.car&&!drag)camYaw+=wrap(P.car.h-camYaw)*Math.min(1,dt*2.5);
 const mode=(camMode===2&&!P.car)?0:camMode,dist=mode===0?(P.car?9:5.5):(mode===1?24:.3),hgt=mode===0?(P.car?3.6:2.6):(mode===1?20:1.45),sy=Math.sin(camYaw),cy=Math.cos(camYaw);

 // audio

 // hud
 P.armor=clamp(P.armor,0,100);$('av').textContent=P.armor.toFixed(0);$('bi').style.width=P.armor+'%';
 $('w').textContent='★'.repeat(P.wanted)+'☆'.repeat(5-P.wanted);$('w').style.color='#ffd23c';$('ms').textContent=P.missions;
 $('sp').textContent=P.car?(sp*2.237).toFixed(0)+' MPH • DRIVING':(P.walk?'ON FOOT • MOVING':'ON FOOT');
 const h=Math.floor(tod*24),mi=Math.floor((tod*24-h)*60);$('ck').textContent=String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');mini()}
const mm=$('mm').getContext('2d');
function mini(){mm.save();mm.fillStyle='#0a0f1a';mm.fillRect(0,0,160,160);mm.translate(80,80);mm.rotate(camYaw-Math.PI);const sc=.5;
 mm.fillStyle='#1d2a40';for(let i=-N;i<N;i++)for(let j=-N;j<N;j++){const x=((i+.5)*B-P.x)*sc,z=((j+.5)*B-P.z)*sc;if(Math.abs(x)<130&&Math.abs(z)<130)mm.fillRect(x-(B-RW)*sc/2,z-(B-RW)*sc/2,(B-RW)*sc,(B-RW)*sc)}
 for(const c of cars){const x=(c.x-P.x)*sc,z=(c.z-P.z)*sc;if(c.type==='police'){mm.fillStyle=Math.floor(performance.now()/200)%2?'#ff2a2a':'#3a7bff';mm.fillRect(x-3,z-3,6,6)}else if(c.type!=='player'){mm.fillStyle='#7d8aa6';mm.fillRect(x-1.5,z-1.5,3,3)}}
 let bx_=(beacon.position.x-P.x)*sc,bz=(beacon.position.z-P.z)*sc;const bl=Math.hypot(bx_,bz);if(bl>70){bx_*=70/bl;bz*=70/bl}mm.fillStyle='#19e68c';mm.beginPath();mm.arc(bx_,bz,4,0,7);mm.fill();mm.restore();
 mm.fillStyle='#19e6ff';mm.beginPath();mm.moveTo(80,72);mm.lineTo(85,86);mm.lineTo(75,86);mm.fill()}
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);R.render(scene,cam);requestAnimationFrame(loop)})(last);
