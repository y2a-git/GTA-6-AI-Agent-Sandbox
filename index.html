    // Self-contained Three.js Face Sculpting + Vice City Human Object Interaction Engine.
    // Serialized into the loaded game's main script scope right after scene.add(jasonMesh, luciaMesh).
    function vcEnhancementModule() {
      if (window.__VC_ENHANCED_ACTIVE__) return;
      window.__VC_ENHANCED_ACTIVE__ = true;

      // Localhost heartbeat support for gta_agent.py watchdog
      if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
        setInterval(function () { fetch('/ping').catch(function () {}); }, 2500);
      }

      // -----------------------------------------------------------------------
      // 1. PROCEDURAL RETRO VICE CITY AUDIO (Web Audio API, zero external files)
      // -----------------------------------------------------------------------
      var audioCtx = null;
      function getAudio() {
        try {
          if (!audioCtx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          }
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
          return audioCtx;
        } catch (e) { return null; }
      }

      function playSfx(type) {
        var ctx = getAudio();
        if (!ctx) return;
        try {
          var now = ctx.currentTime;
          var osc, gain, osc2;
          if (type === 'cash' || type === 'pickup') {
            [880, 1174.66, 1567.98].forEach(function (freq, idx) {
              osc = ctx.createOscillator();
              gain = ctx.createGain();
              osc.type = type === 'cash' ? 'triangle' : 'sine';
              osc.frequency.setValueAtTime(freq, now + idx * 0.055);
              gain.gain.setValueAtTime(0.0001, now + idx * 0.055);
              gain.gain.exponentialRampToValueAtTime(0.11, now + idx * 0.055 + 0.015);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.055 + 0.22);
              osc.connect(gain); gain.connect(ctx.destination);
              osc.start(now + idx * 0.055); osc.stop(now + idx * 0.055 + 0.24);
            });
          } else if (type === 'punch' || type === 'hit') {
            osc = ctx.createOscillator();
            gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(type === 'hit' ? 190 : 140, now);
            osc.frequency.exponentialRampToValueAtTime(38, now + 0.14);
            gain.gain.setValueAtTime(type === 'hit' ? 0.18 : 0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.17);
          } else if (type === 'soda' || type === 'eat') {
            var bufLen = Math.floor(ctx.sampleRate * 0.24);
            var buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
            var data = buf.getChannelData(0);
            for (var i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufLen);
            var noise = ctx.createBufferSource();
            noise.buffer = buf;
            var filter = ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = type === 'soda' ? 2800 : 1100;
            gain = ctx.createGain();
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
            noise.start(now);
            osc = ctx.createOscillator();
            var g2 = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now + 0.14);
            osc.frequency.exponentialRampToValueAtTime(780, now + 0.3);
            g2.gain.setValueAtTime(0.08, now + 0.14);
            g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);
            osc.connect(g2); g2.connect(ctx.destination);
            osc.start(now + 0.14); osc.stop(now + 0.35);
          } else if (type === 'phone') {
            [440, 480].forEach(function (f) {
              osc = ctx.createOscillator();
              gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.value = f;
              gain.gain.setValueAtTime(0.06, now);
              gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
              osc.connect(gain); gain.connect(ctx.destination);
              osc.start(now); osc.stop(now + 0.34);
            });
          } else if (type === 'clatter') {
            osc = ctx.createOscillator();
            osc2 = ctx.createOscillator();
            gain = ctx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(220 + Math.random() * 140, now);
            osc.frequency.exponentialRampToValueAtTime(70, now + 0.12);
            osc2.type = 'triangle'; osc2.frequency.setValueAtTime(340, now);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
            osc.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc2.start(now); osc.stop(now + 0.15); osc2.stop(now + 0.15);
          } else if (type === 'talk') {
            osc = ctx.createOscillator();
            gain = ctx.createGain();
            osc.type = 'sine';
            var baseF = 240 + Math.random() * 120;
            osc.frequency.setValueAtTime(baseF, now);
            osc.frequency.linearRampToValueAtTime(baseF * 1.18, now + 0.08);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.12);
          } else if (type === 'shades') {
            osc = ctx.createOscillator();
            gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(620, now);
            osc.frequency.exponentialRampToValueAtTime(980, now + 0.09);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.12);
          }
        } catch (e) {}
      }

      // -----------------------------------------------------------------------
      // 2. HUD OVERLAYS, SUBTITLES, TOASTS & CONTROLS TABLE INJECTION
      // -----------------------------------------------------------------------
      var uiWrap = document.createElement('div');
      uiWrap.id = 'vc-interact-wrap';
      uiWrap.innerHTML =
        '<div id="vc-speech" aria-live="polite"></div>' +
        '<div id="vc-prompt"></div>' +
        '<div id="vc-action-strip"><kbd>X</kbd>Interact &nbsp;|&nbsp; <kbd>Q</kbd>Punch/Kick &nbsp;|&nbsp; <kbd>Z</kbd>Emote &nbsp;|&nbsp; <kbd>B</kbd>Shades</div>';
      document.body.appendChild(uiWrap);

      var toastLayer = document.createElement('div');
      toastLayer.id = 'vc-toast-layer';
      document.body.appendChild(toastLayer);

      var elSpeech = document.getElementById('vc-speech');
      var elPrompt = document.getElementById('vc-prompt');
      var elStrip = document.getElementById('vc-action-strip');
      var speechTimer = 0;

      function showSpeech(speaker, text, duration) {
        elSpeech.innerHTML = '<b>' + speaker + '</b>' + text;
        elSpeech.classList.add('show');
        speechTimer = duration || 3.4;
      }

      function showToast(text, theme) {
        var d = document.createElement('div');
        d.className = 'vc-toast' + (theme ? ' ' + theme : '');
        d.textContent = text;
        toastLayer.appendChild(d);
        setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1750);
      }

      function patchControlsUI() {
        try {
          var help = document.getElementById('help');
          if (help && !help.dataset.vcPatched) {
            help.dataset.vcPatched = '1';
            var extra = document.createElement('div');
            extra.style.marginTop = '4px';
            extra.style.borderTop = '1px solid rgba(255,255,255,.15)';
            extra.style.paddingTop = '4px';
            extra.innerHTML = '<b>X</b> Interact / Sit / Talk &nbsp; <b>Q</b> Punch / Kick &nbsp; <b>Z</b> Emote &nbsp; <b>B</b> Shades';
            help.appendChild(extra);
          }
          var tbl = document.querySelector('#menu table');
          if (tbl && !tbl.dataset.vcPatched) {
            tbl.dataset.vcPatched = '1';
            var rows = [
              ['X', 'Interact with ATMs, vending machines, payphones, benches & NPCs'],
              ['Q', '3-hit melee punch / kick combo (NPCs & street props)'],
              ['Z / B', 'Human emotes (Z) & toggle Vice City Aviator shades (B)']
            ];
            rows.forEach(function (r) {
              var tr = document.createElement('tr');
              tr.innerHTML = '<td>' + r[0] + '</td><td>' + r[1] + '</td>';
              tbl.appendChild(tr);
            });
          }
        } catch (e) {}
      }
      patchControlsUI();
      setTimeout(patchControlsUI, 1200);

      // Safe stat synchronizer (bridges base game stats if reachable + pulses HUD)
      function adjustStats(opts) {
        var cashDelta = opts.cash || 0;
        var hpDelta = opts.hp || 0;
        var stamDelta = opts.stamina || 0;
        var syncedCash = false;

        try {
          if (cashDelta) {
            if (typeof cash === 'number') { cash = Math.max(0, cash + cashDelta); syncedCash = true; }
            else if (typeof money === 'number') { money = Math.max(0, money + cashDelta); syncedCash = true; }
            else if (typeof score === 'number') { score = Math.max(0, score + cashDelta); syncedCash = true; }
            else {
              var objs = [
                typeof P !== 'undefined' ? P : null,
                typeof player !== 'undefined' ? player : null,
                typeof state !== 'undefined' ? state : null,
                typeof G !== 'undefined' ? G : null
              ];
              for (var i = 0; i < objs.length; i++) {
                var o = objs[i];
                if (!o || typeof o !== 'object') continue;
                if (typeof o.cash === 'number') { o.cash = Math.max(0, o.cash + cashDelta); syncedCash = true; break; }
                if (typeof o.money === 'number') { o.money = Math.max(0, o.money + cashDelta); syncedCash = true; break; }
              }
            }
            var msEl = document.getElementById('ms');
            if (msEl) {
              if (!syncedCash) {
                var cur = parseInt((msEl.textContent || '0').replace(/[^0-9-]/g, ''), 10) || 0;
                msEl.textContent = String.fromCharCode(36) + Math.max(0, cur + cashDelta).toLocaleString();
              }
              msEl.style.transform = 'scale(1.12)';
              setTimeout(function () { msEl.style.transform = ''; }, 220);
            }
          }
          if (hpDelta) {
            var syncedHp = false;
            if (typeof hp === 'number') { hp = Math.min(100, Math.max(1, hp + hpDelta)); syncedHp = true; }
            else if (typeof health === 'number') { health = Math.min(100, Math.max(1, health + hpDelta)); syncedHp = true; }
            else if (typeof P !== 'undefined' && P && typeof P.hp === 'number') { P.hp = Math.min(100, Math.max(1, P.hp + hpDelta)); syncedHp = true; }
            else if (typeof player !== 'undefined' && player && typeof player.hp === 'number') { player.hp = Math.min(100, Math.max(1, player.hp + hpDelta)); syncedHp = true; }
            var bi = document.getElementById('bi');
            if (bi && !syncedHp) {
              var curW = parseFloat(bi.style.width) || 80;
              bi.style.width = Math.min(100, Math.max(5, curW + hpDelta)) + '%';
            }
          }
          if (stamDelta) {
            var syncedSt = false;
            if (typeof stamina === 'number') { stamina = Math.min(100, Math.max(0, stamina + stamDelta)); syncedSt = true; }
            else if (typeof stam === 'number') { stam = Math.min(100, Math.max(0, stam + stamDelta)); syncedSt = true; }
            else if (typeof P !== 'undefined' && P && typeof P.stamina === 'number') { P.stamina = Math.min(100, Math.max(0, P.stamina + stamDelta)); syncedSt = true; }
            var si = document.getElementById('si');
            if (si && !syncedSt) {
              var curS = parseFloat(si.style.width) || 70;
              si.style.width = Math.min(100, Math.max(5, curS + stamDelta)) + '%';
            }
          }
        } catch (e) {}
      }

      // -----------------------------------------------------------------------
      // 3. ENHANCED 3D HUMAN FACE ENGINE (Sculpted Anatomy, Irises, Blinking, Expressions)
      // -----------------------------------------------------------------------
      function setTexSRGB(tex) {
        if (!tex) return;
        if ('colorSpace' in tex && THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
        else if ('encoding' in tex && THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
      }

      var skinBumpTex = (function () {
        var c = document.createElement('canvas');
        c.width = 128; c.height = 128;
        var g = c.getContext('2d');
        var img = g.createImageData(128, 128);
        for (var i = 0; i < img.data.length; i += 4) {
          var v = 120 + Math.floor(Math.random() * 24);
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        var t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(3, 3);
        return t;
      })();

      var irisTexCache = {};
      function getIrisTexture(hexOuter, hexInner) {
        var key = hexOuter + '_' + hexInner;
        if (irisTexCache[key]) return irisTexCache[key];
        var c = document.createElement('canvas');
        c.width = 128; c.height = 128;
        var g = c.getContext('2d');
        var cx = 64, cy = 64;
        g.fillStyle = '#f4f0ea';
        g.fillRect(0, 0, 128, 128);

        var rad = g.createRadialGradient(cx, cy, 10, cx, cy, 56);
        rad.addColorStop(0.0, '#070709');
        rad.addColorStop(0.32, '#0b0b10');
        rad.addColorStop(0.38, hexInner);
        rad.addColorStop(0.76, hexOuter);
        rad.addColorStop(0.92, '#1d1c22');
        rad.addColorStop(1.0, '#e5dfd7');
        g.fillStyle = rad;
        g.beginPath();
        g.arc(cx, cy, 56, 0, Math.PI * 2);
        g.fill();

        g.save();
        g.translate(cx, cy);
        for (var a = 0; a < 42; a++) {
          g.rotate((Math.PI * 2) / 42);
          g.strokeStyle = a % 2 === 0 ? 'rgba(255,255,255,0.16)' : 'rgba(0,0,0,0.22)';
          g.lineWidth = 1.6;
          g.beginPath();
          g.moveTo(21, 0);
          g.lineTo(48, 0);
          g.stroke();
        }
        g.restore();

        g.fillStyle = '#050608';
        g.beginPath();
        g.arc(cx, cy, 19, 0, Math.PI * 2);
        g.fill();

        g.fillStyle = 'rgba(255,255,255,0.94)';
        g.beginPath();
        g.arc(cx - 12, cy - 13, 7.5, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = 'rgba(255,255,255,0.55)';
        g.beginPath();
        g.arc(cx + 10, cy + 9, 3.2, 0, Math.PI * 2);
        g.fill();

        var tex = new THREE.CanvasTexture(c);
        setTexSRGB(tex);
        irisTexCache[key] = tex;
        return tex;
      }

      var NPC_EYE_PALETTES = [
        ['#3c6e8c', '#82b6c7'],
        ['#5c3d28', '#9c6e44'],
        ['#3d6847', '#7fa872'],
        ['#4b3b2c', '#7d5a3b'],
        ['#455873', '#7d98b5']
      ];

      function isSkinMaterial(mat) {
        if (!mat) return false;
        if (typeof skinCache !== 'undefined' && skinCache && skinCache.values) {
          for (var m of skinCache.values()) {
            if (m === mat) return true;
          }
        }
        if (mat.color) {
          var r = mat.color.r, g = mat.color.g, b = mat.color.b;
          if (r > 0.34 && r > g * 0.96 && g > b * 0.90 && (r - b) > 0.06 && (r - b) < 0.62) {
            return true;
          }
        }
        return false;
      }

      function getMeshBoundsInGroup(mesh, group, invGroupMat) {
        if (!mesh.geometry) return null;
        if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
        var bb = mesh.geometry.boundingBox;
        if (!bb || bb.isEmpty()) return null;
        var box = bb.clone();
        var rel = new THREE.Matrix4().multiplyMatrices(invGroupMat, mesh.matrixWorld);
        box.applyMatrix4(rel);
        return box;
      }

      function findHumanAnatomy(charGroup) {
        charGroup.updateMatrixWorld(true);
        var invGroup = new THREE.Matrix4().copy(charGroup.matrixWorld).invert();
        var meshes = [];
        var totalBox = new THREE.Box3();
        charGroup.traverse(function (obj) {
          if (obj.isMesh && !obj.userData.__vcAdded) {
            var b = getMeshBoundsInGroup(obj, charGroup, invGroup);
            if (b) {
              var sz = new THREE.Vector3();
              var ct = new THREE.Vector3();
              b.getSize(sz); b.getCenter(ct);
              meshes.push({ mesh: obj, box: b, size: sz, center: ct });
              totalBox.union(b);
            }
          }
        });
        if (meshes.length < 2 || totalBox.isEmpty()) return null;
        var totalSize = new THREE.Vector3();
        totalBox.getSize(totalSize);
        var H = totalSize.y;
        if (H < 0.9 || H > 3.0) return null;

        var headItem = null;
        var bestScore = -999;
        for (var i = 0; i < meshes.length; i++) {
          var it = meshes[i];
          var relY = (it.center.y - totalBox.min.y) / H;
          var maxDim = Math.max(it.size.x, it.size.y, it.size.z);
          var minDim = Math.min(it.size.x, it.size.y, it.size.z);
          var score = 0;
          if (/head|face|skull/i.test(it.mesh.name || '')) score += 50;
          if (isSkinMaterial(it.mesh.material)) score += 25;
          if (relY > 0.72 && relY < 0.97) score += 20;
          if (Math.abs(it.center.x) < H * 0.14) score += 12;
          if (maxDim > H * 0.085 && maxDim < H * 0.30 && minDim > H * 0.06) score += 15;
          if (it.size.y < H * 0.065) score -= 35;
          if (score > bestScore) {
            bestScore = score;
            headItem = it;
          }
        }
        if (!headItem || bestScore < 20) return null;

        var hairColor = new THREE.Color(0x2a1d15);
        var zVotes = 0;
        var oldFaceDots = [];
        var headR = Math.max(headItem.size.x, headItem.size.y, headItem.size.z) * 0.5;
        for (var j = 0; j < meshes.length; j++) {
          var m = meshes[j];
          if (m.mesh === headItem.mesh) continue;
          var dist = m.center.distanceTo(headItem.center);
          if (dist < headR * 1.9) {
            var mMax = Math.max(m.size.x, m.size.y, m.size.z);
            var dz = m.center.z - headItem.center.z;
            if (mMax < headR * 0.56 && Math.abs(dz) > headR * 0.42 && m.center.y < headItem.center.y + headR * 0.55) {
              zVotes += dz > 0 ? 1 : -1;
              oldFaceDots.push(m.mesh);
            } else if (m.center.y >= headItem.center.y + headR * 0.15 && m.mesh.material && m.mesh.material.color && !isSkinMaterial(m.mesh.material)) {
              hairColor.copy(m.mesh.material.color);
            }
          }
        }
        var fwdZ = zVotes < 0 ? -1 : 1;

        var limbs = { leftArm: null, rightArm: null, leftLeg: null, rightLeg: null };
        for (var k = 0; k < meshes.length; k++) {
          var lm = meshes[k];
          if (lm.mesh === headItem.mesh) continue;
          var rY = (lm.center.y - totalBox.min.y) / H;
          var n = (lm.mesh.name || '').toLowerCase();
          var targetObj = (lm.mesh.parent && lm.mesh.parent !== charGroup && lm.mesh.parent.children.length <= 4) ? lm.mesh.parent : lm.mesh;
          if (rY > 0.40 && rY < 0.78 && Math.abs(lm.center.x) > H * 0.09) {
            var isRight = (lm.center.x * fwdZ) < 0;
            if (/right.*arm|r_arm|armr/i.test(n)) isRight = true;
            if (/left.*arm|l_arm|arml/i.test(n)) isRight = false;
            if (isRight && !limbs.rightArm) limbs.rightArm = targetObj;
            if (!isRight && !limbs.leftArm) limbs.leftArm = targetObj;
          }
          if (rY < 0.46 && Math.abs(lm.center.x) > H * 0.04 && lm.size.y > H * 0.16) {
            var isRLeg = (lm.center.x * fwdZ) < 0;
            if (/right.*leg|r_leg|legr/i.test(n)) isRLeg = true;
            if (/left.*leg|l_leg|legl/i.test(n)) isRLeg = false;
            if (isRLeg && !limbs.rightLeg) limbs.rightLeg = targetObj;
            if (!isRLeg && !limbs.leftLeg) limbs.leftLeg = targetObj;
          }
        }

        return {
          headMesh: headItem.mesh,
          headSize: headItem.size,
          totalBox: totalBox,
          height: H,
          fwdZ: fwdZ,
          hairColor: hairColor,
          oldFaceDots: oldFaceDots,
          limbs: limbs
        };
      }

          var dx = existingPts[j].x - x;
          var dz = existingPts[j].z - z;

      function populateViceCityWorld(origin) {
        if (worldSpawned) return;
        worldSpawned = true;
        var bBoxes = getBuildingBoxes();
        var used = [new THREE.Vector3(origin.x, 0, origin.z)];

        function pickClearSpot(minR, maxR, spacing) {
          for (var tries = 0; tries < 60; tries++) {
            var ang = Math.random() * Math.PI * 2;
            var dist = minR + Math.random() * (maxR - minR);
            var px = origin.x + Math.cos(ang) * dist;
            var pz = origin.z + Math.sin(ang) * dist;
            if (isSpotClear(px, pz, bBoxes, used, spacing)) {
              used.push(new THREE.Vector3(px, 0, pz));
              return { x: px, z: pz, rotY: Math.atan2(origin.x - px, origin.z - pz) };
            }
          }
          return null;
        }

        var s;
        if ((s = pickClearSpot(5.5, 13, 3.6))) createVendingMachine(s.x, s.z, s.rotY);
        if ((s = pickClearSpot(6.0, 14, 3.6))) createATM(s.x, s.z, s.rotY);
        if ((s = pickClearSpot(6.5, 15, 3.6))) createPayphone(s.x, s.z, s.rotY);
        if ((s = pickClearSpot(5.5, 13, 3.8))) createBench(s.x, s.z, s.rotY);
        if ((s = pickClearSpot(8.0, 17, 4.0))) createFoodCart(s.x, s.z, s.rotY);

        if ((s = pickClearSpot(5.0, 14, 2.6))) spawnPickup('health', s.x, s.z, 45);
        if ((s = pickClearSpot(7.0, 16, 2.6))) spawnPickup('armor', s.x, s.z, 50);

        for (var c = 0; c < 3; c++) if ((s = pickClearSpot(4.5, 14, 2.2))) spawnPhysicsProp('trashcan', s.x, s.z);
        for (var k = 0; k < 4; k++) if ((s = pickClearSpot(4.0, 13, 1.8))) spawnPhysicsProp('cone', s.x, s.z);
        for (var b = 0; b < 2; b++) if ((s = pickClearSpot(4.0, 12, 2.0))) spawnPhysicsProp('ball', s.x, s.z);

        for (var w = 0; w < 3; w++) {
          if ((s = pickClearSpot(24, 78, 8.0))) createATM(s.x, s.z, Math.random() * Math.PI * 2);
          if ((s = pickClearSpot(24, 78, 8.0))) createVendingMachine(s.x, s.z, Math.random() * Math.PI * 2);
          if ((s = pickClearSpot(24, 78, 8.0))) createPayphone(s.x, s.z, Math.random() * Math.PI * 2);
          if ((s = pickClearSpot(22, 74, 8.0))) createBench(s.x, s.z, Math.random() * Math.PI * 2);
          if ((s = pickClearSpot(26, 82, 8.0))) createFoodCart(s.x, s.z, Math.random() * Math.PI * 2);
          if ((s = pickClearSpot(20, 75, 6.0))) spawnPickup('health', s.x, s.z, 45);
          if ((s = pickClearSpot(18, 65, 4.0))) spawnPhysicsProp(w % 2 === 0 ? 'trashcan' : 'ball', s.x, s.z);
        }
      }

      function getActivePlayer(cam) {
        var jVis = jasonMesh && jasonMesh.visible;
        var lVis = luciaMesh && luciaMesh.visible;
        if (!jVis && !lVis) {
          playerState.onFoot = false;
          return null;
        }
        playerState.onFoot = true;
        if (jVis && !lVis) return jasonEntry;
        if (lVis && !jVis) return luciaEntry;
        if (cam) {
          var dir = new THREE.Vector3();
          cam.getWorldDirection(dir);
          var focus = cam.position.clone().addScaledVector(dir, 5.5);
          var dj = jasonMesh.position.distanceToSquared(focus);

          return dj <= dl ? jasonEntry : luciaEntry;
        }
        return jasonEntry || luciaEntry;

        playerState.actionTimer = dur;
        playerState.actionDur = dur;
        if (name !== 'sit') playerState.sittingBench = null;
        if (emotion && playerState.activeEntry) setEmotion(playerState.activeEntry, emotion, dur + 0.5);
      }

      function findNearestTarget(pPos) {
        var best = null;
        var bestDist = Infinity;

        for (var i = 0; i < interactables.length; i++) {
          var item = interactables[i];
          var d = pPos.distanceTo(item.group.position);
          if (d < item.radius && d < bestDist) {
            bestDist = d;
            best = { kind: 'prop', data: item, dist: d };
          }
        }

        for (var j = 0; j < humanRegistry.length; j++) {
          var h = humanRegistry[j];
          if (h === playerState.activeEntry || !h.group.visible) continue;
          var dh = pPos.distanceTo(h.group.position);
          if (dh < 2.9 && dh < bestDist) {
            bestDist = dh;
            best = { kind: 'human', data: h, dist: dh };
          }
        }
        return best;
      }

      function triggerInteract() {
        var active = playerState.activeEntry;
        if (!active || !playerState.onFoot) return;

        if (playerState.sittingBench) {
          playerState.sittingBench = null;
          playerState.action = null;
          showToast('STOOD UP', 'cyan');
          return;
        }

        var target = findNearestTarget(active.group.position);
        if (!target) {
          startAction('wave', 1.1, 'happy');
          playSfx('talk');
          showToast('VICE WAVE', 'cyan');
          return;
        }

        if (target.kind === 'human') {
          var npc = target.data;
          var toNpc = Math.atan2(npc.group.position.x - active.group.position.x, npc.group.position.z - active.group.position.z);
          active.group.rotation.y = active.fwd > 0 ? toNpc : toNpc + Math.PI;
          var toPlayer = Math.atan2(active.group.position.x - npc.group.position.x, active.group.position.z - npc.group.position.z);
          npc.group.rotation.y = npc.fwd > 0 ? toPlayer : toPlayer + Math.PI;

          startAction('wave', 1.35, 'happy');
          setEmotion(npc, 'happy', 2.8);
          active.talkTimer = 1.6;
          npc.talkTimer = 2.6;
          playSfx('talk');

          var isPartner = (npc === jasonEntry || npc === luciaEntry);
          var pool = isPartner ? PARTNER_LINES : NPC_GREETINGS;
          var line = pool[Math.floor(Math.random() * pool.length)];
          showSpeech(npc.name, line, 3.6);
          return;
        }

        var prop = target.data;
        if (prop.type === 'atm') {
          if (prop.cooldown > 0) {
            showToast('ATM COOLDOWN (' + Math.ceil(prop.cooldown) + 's)', 'pink');
            return;
          }
          prop.cooldown = 25;
          if (prop.led) prop.led.material.color.setHex(0xffb84d);
          startAction('atm', 1.3, 'happy');
          playSfx('cash');
          adjustStats({ cash: 250 });
          showToast('+250 VICE BANK ATM', 'gold');
          showSpeech('Vice Bank ATM', 'Cash withdrawal approved. Have a Vice day!', 2.6);
        } else if (prop.type === 'vending') {
          if (prop.cooldown > 0) {
            showToast('DISPENSER COOLING...', 'pink');
            return;
          }
          prop.cooldown = 5;
          startAction('drink', 1.6, 'happy');
          attachHandProp(active, 0x4df57a, 'can');
          playSfx('soda');
          adjustStats({ cash: -5, hp: 25, stamina: 40 });
          showToast('SPRUNK! +25 HP | +40 STAMINA', 'cyan');
        } else if (prop.type === 'payphone') {
          if (prop.cooldown > 0) {
            showToast('NO NEW CALLS YET', 'cyan');
            return;
          }
          prop.cooldown = 30;
          startAction('phone', 2.4, 'focused');
          active.talkTimer = 2.1;
          playSfx('phone');
          adjustStats({ cash: 200 });
          var tip = PAYPHONE_TIPS[Math.floor(Math.random() * PAYPHONE_TIPS.length)];
          showSpeech('Vice Payphone', tip, 4.4);
          showToast('+200 STREET HUSTLE', 'gold');
        } else if (prop.type === 'bench') {
          playerState.sittingBench = prop;
          playerState.action = 'sit';
          playerState.actionTimer = 9999;
          setEmotion(active, 'happy', 3.0);
          showToast('RELAXING - REGENERATING HP', 'cyan');
          showSpeech(active.name, 'Catching the Ocean Drive breeze... (Press X or move to stand)', 2.8);
        } else if (prop.type === 'food') {
          if (prop.cooldown > 0) {
            showToast('GRILL HEATING UP...', 'pink');
            return;
          }
          prop.cooldown = 10;
          startAction('eat', 1.7, 'happy');
          attachHandProp(active, 0xf2a24b, 'burger');
          playSfx('eat');
          adjustStats({ cash: -10, hp: 100, stamina: 50 });
          showToast('VICE BURGER - FULL HEALTH!', 'pink');
        }
      }

      function triggerMelee() {
        var active = playerState.activeEntry;
        if (!active || !playerState.onFoot) return;
        if (playerState.sittingBench) playerState.sittingBench = null;

        if (playerState.comboWindow > 0) playerState.comboStep = (playerState.comboStep + 1) % 3;
        else playerState.comboStep = 0;
        playerState.comboWindow = 0.95;

        var moveName = playerState.comboStep === 0 ? 'punch1' : (playerState.comboStep === 1 ? 'punch2' : 'kick');
        startAction(moveName, 0.42, 'angry');
        playSfx('punch');

        var pPos = active.group.position;
        var fwdDir = new THREE.Vector3(Math.sin(active.group.rotation.y), 0, Math.cos(active.group.rotation.y)).multiplyScalar(active.fwd);
        var hitSomething = false;

        for (var i = 0; i < humanRegistry.length; i++) {
          var npc = humanRegistry[i];
          if (npc === active || !npc.group.visible || npc.hitCooldown > 0) continue;
          var diff = npc.group.position.clone().sub(pPos);
          diff.y = 0;
          var dist = diff.length();
          if (dist < 2.45) {
            hitSomething = true;
            npc.hitCooldown = 0.55;
            npc.stumbleTimer = 0.85;
            var push = dist > 0.05 ? diff.normalize() : fwdDir.clone();
            npc.knockVel.copy(push.multiplyScalar(moveName === 'kick' ? 8.5 : 5.5));
            setEmotion(npc, 'surprised', 2.6);
            npc.talkTimer = 1.6;
            playSfx('hit');
            showSpeech(npc.name, NPC_HIT_LINES[Math.floor(Math.random() * NPC_HIT_LINES.length)], 2.5);
            if (Math.random() < 0.55 && npc !== jasonEntry && npc !== luciaEntry) {
              var cashAmt = 50 + Math.floor(Math.random() * 100);
              spawnPickup('cash', npc.group.position.x + (Math.random() - 0.5), npc.group.position.z + (Math.random() - 0.5), cashAmt);
              showToast('CASH DROPPED!', 'gold');
            }
          }
        }

        for (var j = 0; j < physicsProps.length; j++) {
          var pp = physicsProps[j];
          var dProp = pp.group.position.clone().sub(pPos);
          dProp.y = 0;
          if (dProp.length() < 2.6) {
            hitSomething = true;
            var dirP = dProp.length() > 0.05 ? dProp.normalize() : fwdDir.clone();
            pp.vel.set(dirP.x * 10.5, 4.8 + Math.random() * 2.2, dirP.z * 10.5);
            pp.angVel.set((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 14);
            playSfx('clatter');
          }
        }

        for (var v = 0; v < interactables.length; v++) {
          var it = interactables[v];
          if (it.type === 'vending' && pPos.distanceTo(it.group.position) < 2.5) {
            hitSomething = true;
            it.shakeTimer = 0.45;
            playSfx('clatter');
            if (it.cooldown <= 0) {
              it.cooldown = 8;
              adjustStats({ hp: 15, stamina: 20 });
              showToast('FREE SPRUNK SHAKEN LOOSE! +15 HP', 'cyan');
            }
          }
        }

        if (hitSomething) {
          showToast(moveName === 'kick' ? 'ROUNDHOUSE KICK!' : (moveName === 'punch2' ? 'RIGHT CROSS!' : 'LEFT JAB!'), 'pink');
        }
      }

      function triggerEmote() {
        var active = playerState.activeEntry;
        if (!active || !playerState.onFoot) return;
        var emotes = [
          { id: 'wave', label: 'WAVE HELLO', dur: 1.5, emo: 'happy' },
          { id: 'watch', label: 'CHECK WATCH', dur: 1.8, emo: 'focused' },
          { id: 'celebrate', label: 'VICE CELEBRATION', dur: 1.9, emo: 'happy' },
          { id: 'flex', label: 'STREET STANCE', dur: 1.6, emo: 'angry' }
        ];
        var em = emotes[playerState.emoteIdx % emotes.length];
        playerState.emoteIdx++;
        startAction(em.id, em.dur, em.emo);
        playSfx('talk');
        showToast(em.label, 'cyan');
      }

      function toggleShades() {
        var active = playerState.activeEntry;
        if (!active || !active.shadesRig) return;
        active.shadesRig.visible = !active.shadesRig.visible;
        playSfx('shades');
        showToast(active.shadesRig.visible ? 'VICE AVIATORS ON' : 'VICE AVIATORS OFF', 'gold');
      }

      // Bind Vice City interaction keys (conflict-free with WASD/F/E/G/T/V/C/H/R)
      window.addEventListener('keydown', function (e) {
        if (e.repeat) return;
        var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;
        var k = (e.key || '').toLowerCase();
        if (k === 'x') triggerInteract();
        else if (k === 'q') triggerMelee();
        else if (k === 'z') triggerEmote();
        else if (k === 'b') toggleShades();
        else if (playerState.sittingBench && (k === 'w' || k === 'a' || k === 's' || k === 'd' || k === 'f' || k === 'e' || k === 'g' || k === ' ' || k.indexOf('arrow') === 0)) {
          playerState.sittingBench = null;
          playerState.action = null;
        }
      });

      // -----------------------------------------------------------------------
      // 6. PER-FRAME ANIMATION LOOP (Hooked cleanly into R.render)
      // -----------------------------------------------------------------------
      function updateFaceAnimation(entry, dt, nowSec, focusPoint) {
        entry.blinkTimer -= dt;
        if (entry.blinkTimer <= 0) {
          entry.blinkState = 1.0;
          entry.blinkTimer = 2.4 + Math.random() * 3.8;
        }
        if (entry.blinkState > 0) {
          entry.blinkState = Math.max(0, entry.blinkState - dt * 6.5);
        }
        var blinkClose = Math.sin(entry.blinkState * Math.PI);
        for (var i = 0; i < entry.lids.length; i++) {
          entry.lids[i].pivot.rotation.x = entry.fwd * (blinkClose * 0.95);
        }

        if (entry.emotionTimer > 0) {
          entry.emotionTimer -= dt;
          if (entry.emotionTimer <= 0) entry.emotion = 'neutral';
        }
        for (var b = 0; b < entry.brows.length; b++) {
          var br = entry.brows[b];
          var targetY = br.baseY;
          var targetZ = 0;
          if (entry.emotion === 'angry') {
            targetY = br.baseY - 0.015;
            targetZ = br.side * 0.28;
          } else if (entry.emotion === 'surprised') {
            targetY = br.baseY + 0.025;
            targetZ = -br.side * 0.14;
          } else if (entry.emotion === 'happy') {
            targetY = br.baseY + 0.012;
            targetZ = -br.side * 0.08;
          } else if (entry.emotion === 'focused') {
            targetY = br.baseY - 0.008;
            targetZ = br.side * 0.10;
          }
          br.pivot.position.y += (targetY - br.pivot.position.y) * Math.min(1, dt * 10);
          br.pivot.rotation.z += (targetZ - br.pivot.rotation.z) * Math.min(1, dt * 10);
        }

        var mouthOpen = 0;
        if (entry.talkTimer > 0) {
          entry.talkTimer -= dt;
          mouthOpen = 0.45 + 0.55 * Math.abs(Math.sin(nowSec * 15 + entry.blinkTimer));
        } else if (entry.emotion === 'surprised') {
          mouthOpen = 0.72;
        } else if (entry.emotion === 'angry') {
          mouthOpen = 0.22;
        }
        entry.mouthCav.scale.y = 0.18 + mouthOpen * 0.78;
        entry.lowerLip.position.y = -0.012 - mouthOpen * 0.024;

        var gazeX = Math.sin(nowSec * 0.9 + entry.blinkTimer) * 0.08;
        var gazeY = Math.cos(nowSec * 0.65) * 0.04;
        if (focusPoint && entry.group.visible) {
          var dist = entry.group.position.distanceTo(focusPoint);
          if (dist > 0.5 && dist < 8) {
            var toF = Math.atan2(focusPoint.x - entry.group.position.x, focusPoint.z - entry.group.position.z);
            var relAng = toF - entry.group.rotation.y - (entry.fwd < 0 ? Math.PI : 0);
            while (relAng > Math.PI) relAng -= Math.PI * 2;
            while (relAng < -Math.PI) relAng += Math.PI * 2;
            gazeX = Math.max(-0.22, Math.min(0.22, relAng * 0.35));
          }
        }
        for (var e = 0; e < entry.eyes.length; e++) {
          entry.eyes[e].rotation.y = gazeX;
          entry.eyes[e].rotation.x = gazeY;
        }
      }

      function applyPlayerActionPose(active, dt, nowSec) {
        if (!active || !playerState.action) return;
        var limbs = active.anat.limbs;
        var f = active.fwd;

        if (playerState.action === 'sit' && playerState.sittingBench) {
          var bench = playerState.sittingBench.group;
          var benchFwd = new THREE.Vector3(Math.sin(bench.rotation.y), 0, Math.cos(bench.rotation.y));
          active.group.position.x = bench.position.x + benchFwd.x * 0.18;
          active.group.position.z = bench.position.z + benchFwd.z * 0.18;
          active.group.position.y = groundY - 0.18;
          active.group.rotation.y = f > 0 ? bench.rotation.y : bench.rotation.y + Math.PI;
          if (limbs.leftLeg) limbs.leftLeg.rotation.x = -1.25 * f;
          if (limbs.rightLeg) limbs.rightLeg.rotation.x = -1.25 * f;
          if (limbs.leftArm) limbs.leftArm.rotation.x = -0.35 * f;
          if (limbs.rightArm) limbs.rightArm.rotation.x = -0.35 * f;
          if (Math.random() < dt * 2.5) adjustStats({ hp: 2, stamina: 5 });
          return;
        }

        playerState.actionTimer -= dt;
        if (playerState.actionTimer <= 0) {
          playerState.action = null;
          clearHandProp();
          return;
        }

        var t = 1 - (playerState.actionTimer / Math.max(0.05, playerState.actionDur));
        var arc = Math.sin(t * Math.PI);

        if (playerState.action === 'punch1' && limbs.leftArm) {
          limbs.leftArm.rotation.x = -1.65 * arc * f;
          limbs.leftArm.rotation.z = 0.25 * arc;
        } else if (playerState.action === 'punch2' && limbs.rightArm) {
          limbs.rightArm.rotation.x = -1.75 * arc * f;
          limbs.rightArm.rotation.z = -0.35 * arc;
        } else if (playerState.action === 'kick' && limbs.rightLeg) {
          limbs.rightLeg.rotation.x = -1.45 * arc * f;
          if (limbs.leftArm) limbs.leftArm.rotation.x = 0.55 * arc * f;
        } else if (playerState.action === 'wave' && limbs.rightArm) {
          limbs.rightArm.rotation.x = -2.45 * f;
          limbs.rightArm.rotation.z = -0.35 + Math.sin(nowSec * 14) * 0.32;
        } else if ((playerState.action === 'drink' || playerState.action === 'eat') && limbs.rightArm) {
          limbs.rightArm.rotation.x = (-1.95 - Math.sin(nowSec * 8) * 0.15) * f;
          limbs.rightArm.rotation.z = 0.25;
        } else if (playerState.action === 'phone' && limbs.rightArm) {
          limbs.rightArm.rotation.x = -2.25 * f;
          limbs.rightArm.rotation.z = 0.45;
        } else if (playerState.action === 'atm' && limbs.rightArm) {
          limbs.rightArm.rotation.x = (-1.15 + Math.sin(nowSec * 18) * 0.14) * f;
        } else if (playerState.action === 'watch' && limbs.leftArm) {
          limbs.leftArm.rotation.x = -1.35 * f;
          limbs.leftArm.rotation.z = -0.45;
        } else if (playerState.action === 'celebrate') {
          if (limbs.leftArm) { limbs.leftArm.rotation.x = -2.85 * f; limbs.leftArm.rotation.z = 0.28 + Math.sin(nowSec * 12) * 0.18; }
          if (limbs.rightArm) { limbs.rightArm.rotation.x = -2.85 * f; limbs.rightArm.rotation.z = -0.28 - Math.sin(nowSec * 12) * 0.18; }
        } else if (playerState.action === 'flex') {
          if (limbs.leftArm) { limbs.leftArm.rotation.x = -1.45 * f; limbs.leftArm.rotation.z = 0.85; }
          if (limbs.rightArm) { limbs.rightArm.rotation.x = -1.45 * f; limbs.rightArm.rotation.z = -0.85; }
        }
      }

      var lastTime = performance.now();
      var scanTimer = 0.5;
      var loggedErr = false;

      var _origRender = R.render.bind(R);
      R.render = function (sc, cam) {
        try {
          var nowMs = performance.now();
          var dt = Math.min(0.05, Math.max(0.001, (nowMs - lastTime) / 1000));
          lastTime = nowMs;
          var nowSec = nowMs * 0.001;

          if (speechTimer > 0) {
            speechTimer -= dt;
            if (speechTimer <= 0) elSpeech.classList.remove('show');
          }

          if (playerState.comboWindow > 0) playerState.comboWindow -= dt;

          var active = getActivePlayer(cam);
          playerState.activeEntry = active;

          if (active && !worldSpawned) {
            var pBox = new THREE.Box3().setFromObject(active.group);
            if (!pBox.isEmpty()) groundY = Math.abs(pBox.min.y) < 1.5 ? pBox.min.y : 0;
            populateViceCityWorld(active.group.position);
          }

          scanTimer -= dt;
          if (scanTimer <= 0) {
            scanTimer = 1.6;
            scanForNewHumans();
          }

          for (var i = 0; i < interactables.length; i++) {
            var it = interactables[i];
            if (it.cooldown > 0) {
              it.cooldown = Math.max(0, it.cooldown - dt);
              if (it.cooldown === 0 && it.led) it.led.material.color.setHex(0x4dff9b);
            }
            if (it.ring) {
              var pulse = 1 + Math.sin(nowSec * 3.2 + i) * 0.07;
              it.ring.scale.set(pulse, pulse, 1);
            }
            if (it.type === 'payphone' && it.neonTop && it.cooldown <= 0) {
              it.neonTop.material.emissiveIntensity = 0.65 + 0.55 * Math.abs(Math.sin(nowSec * 5));
            }
            if (it.shakeTimer && it.shakeTimer > 0) {
              it.shakeTimer -= dt;
              it.group.position.x = it.basePos.x + (Math.random() - 0.5) * 0.14;
              it.group.position.z = it.basePos.z + (Math.random() - 0.5) * 0.14;
              if (it.shakeTimer <= 0) it.group.position.copy(it.basePos);
            }
          }

          for (var p = 0; p < pickups.length; p++) {
            var pk = pickups[p];
            if (pk.collected) {
              if (pk.type !== 'cash') {
                pk.respawnTimer -= dt;
                if (pk.respawnTimer <= 0) {
                  pk.collected = false;
                  pk.group.visible = true;
                }
              }
              continue;
            }
            pk.group.rotation.y += dt * 2.2;
            pk.group.position.y = pk.baseY + Math.sin(nowSec * 3.0 + pk.phase) * 0.14;

            if (active && playerState.onFoot) {
              var dPk = active.group.position.distanceTo(pk.group.position);
              if (dPk < 1.65) {
                pk.collected = true;
                pk.group.visible = false;
                pk.respawnTimer = 28;
                playSfx(pk.type === 'cash' ? 'cash' : 'pickup');
                if (pk.type === 'health') {
                  adjustStats({ hp: pk.value });
                  showToast('+' + pk.value + ' HEALTH PICKUP', 'pink');
                } else if (pk.type === 'armor') {
                  adjustStats({ hp: 35, stamina: 100 });
                  showToast('VICE ARMOR | MAX STAMINA', 'cyan');
                } else {
                  adjustStats({ cash: pk.value });
                  showToast('+' + pk.value + ' CASH', 'gold');
                }
              }
            }
          }

          for (var k = 0; k < physicsProps.length; k++) {
            var pr = physicsProps[k];
            if (active && playerState.onFoot) {
              var dx = pr.group.position.x - active.group.position.x;
              var dz = pr.group.position.z - active.group.position.z;
              var distSq = dx * dx + dz * dz;
              var minD = pr.radius + 0.55;
              if (distSq < minD * minD && distSq > 0.0001) {
                var dLen = Math.sqrt(distSq);
                var nx = dx / dLen, nz = dz / dLen;
                pr.vel.x += nx * (pr.kind === 'ball' ? 6.5 : 4.2);
                pr.vel.z += nz * (pr.kind === 'ball' ? 6.5 : 4.2);
                pr.vel.y = Math.max(pr.vel.y, pr.kind === 'ball' ? 3.2 : 1.6);
                pr.angVel.set(nz * 7, (Math.random() - 0.5) * 6, -nx * 7);
                playSfx('clatter');
              }
            }
            if (pr.vel.lengthSq() > 0.002 || pr.group.position.y > groundY + 0.01) {
              pr.vel.y -= 15.5 * dt;
              pr.group.position.addScaledVector(pr.vel, dt);
              pr.group.rotation.x += pr.angVel.x * dt;
              pr.group.rotation.y += pr.angVel.y * dt;
              pr.group.rotation.z += pr.angVel.z * dt;
              if (pr.group.position.y < groundY) {
                pr.group.position.y = groundY;
                if (Math.abs(pr.vel.y) > 1.2) pr.vel.y = -pr.vel.y * pr.bounciness;
                else pr.vel.y = 0;
                pr.vel.x *= Math.pow(0.18, dt);
                pr.vel.z *= Math.pow(0.18, dt);
                pr.angVel.multiplyScalar(Math.pow(0.12, dt));
              }
            }
          }

          var focusPt = active ? active.group.position : (cam ? cam.position : null);
          for (var h = 0; h < humanRegistry.length; h++) {
            var hum = humanRegistry[h];
            if (!hum.group || !hum.group.parent) continue;
            if (hum.hitCooldown > 0) hum.hitCooldown -= dt;
            if (hum.bumpCooldown > 0) hum.bumpCooldown -= dt;

            if (hum.stumbleTimer > 0) {
              hum.stumbleTimer -= dt;
              hum.group.position.addScaledVector(hum.knockVel, dt);
              hum.knockVel.multiplyScalar(Math.pow(0.05, dt));
            }

            if (active && playerState.onFoot && hum !== active && hum.group.visible && hum.bumpCooldown <= 0 && hum.stumbleTimer <= 0) {
              var bdx = hum.group.position.x - active.group.position.x;
              var bdz = hum.group.position.z - active.group.position.z;
              var bd2 = bdx * bdx + bdz * bdz;
              if (bd2 < 0.72 && bd2 > 0.001) {
                hum.bumpCooldown = 2.6;
                var bLen = Math.sqrt(bd2);
                hum.knockVel.set((bdx / bLen) * 3.0, 0, (bdz / bLen) * 3.0);
                hum.stumbleTimer = 0.35;
                setEmotion(hum, 'surprised', 1.8);
                hum.talkTimer = 1.3;
                playSfx('talk');
                showSpeech(hum.name, NPC_BUMP_LINES[Math.floor(Math.random() * NPC_BUMP_LINES.length)], 2.2);
              }
            }

            updateFaceAnimation(hum, dt, nowSec, hum === active ? (cam ? cam.position : null) : focusPt);
          }

          if (active && playerState.onFoot) {
            applyPlayerActionPose(active, dt, nowSec);
          }

          if (active && playerState.onFoot) {
            elStrip.classList.remove('hidden');
            if (playerState.sittingBench) {
              elPrompt.innerHTML = '<kbd>X</kbd> Stand Up from Bench';
              elPrompt.classList.add('show');
            } else {
              var near = findNearestTarget(active.group.position);
              if (near) {
                var txt = near.kind === 'human'
                  ? 'Talk to ' + near.data.name
                  : near.data.label;
                elPrompt.innerHTML = '<kbd>X</kbd> ' + txt;
                elPrompt.classList.add('show');
              } else {
                elPrompt.classList.remove('show');
              }
            }
          } else {
            elStrip.classList.add('hidden');
            elPrompt.classList.remove('show');
          }
        } catch (err) {
          if (!loggedErr) {
            loggedErr = true;
            console.warn('VC enhancement warning:', err);
          }
        }
        return _origRender.apply(this, arguments);
      };
    }

    const showBootError=(message)=>{
      document.querySelector('#boot p').textContent='The game could not start.';
      document.querySelector('#boot .pulse').style.display='none';
      const error=document.getElementById('error');error.style.display='block';error.textContent=message;
    };

    async function boot(){
      try{
        const controller=new AbortController();
        const timeout=setTimeout(()=>controller.abort(),15000);
        let response;
        try{response=await fetch(sourceURL,{mode:'cors',cache:'no-cache',signal:controller.signal})}
        finally{clearTimeout(timeout)}
        if(!response.ok)throw new Error('Game source request failed (HTTP '+response.status+').');
        let html=await response.text();
        if(!html.includes('</style>')||!html.includes("addEventListener('keydown'")||!html.includes('THREE.WebGLRenderer'))throw new Error('The saved game source did not pass its integrity checks.');

        // Show script/CDN failures directly in the page instead of silently appearing frozen.
        const diagnostics=`<script>(function(){function report(message){if(document.getElementById('vc-runtime-error'))return;var box=document.createElement('div');box.id='vc-runtime-error';box.setAttribute('role','alert');box.innerHTML='<b>Game runtime error</b><br>';box.appendChild(document.createTextNode(String(message||'Unknown error')));document.body.appendChild(box)}window.addEventListener('error',function(e){if(e.message)report(e.message);else if(e.target&&e.target.src)report('Could not load dependency: '+e.target.src)},{capture:true});window.addEventListener('unhandledrejection',function(e){report(e.reason&&e.reason.message||e.reason)});setTimeout(function(){if(!document.querySelector('canvas.main'))report('The renderer did not initialize. Check WebGL and the Three.js CDN connection.')},12000)})();<\/script>`;

        // Use function replacers (() => ...) so '$' characters in injected code are NEVER interpreted as special replacement tokens.
        html=html.replace('</head>',()=>diagnostics+'\n</head>');
        html=html.replace('</style>',()=>polish+'\n</style>');

        // Lighting polish + Sculpted Faces & Vice City Human Interaction Engine
        const visualTune=`\n/* Enhanced natural-light/material response; keep stylized meshes and gameplay intact. */\nR.toneMappingExposure=1.08;\nhemi.color.setHex(0xffd5c4);hemi.groundColor.setHex(0x38333a);hemi.intensity=.82;\nsun.color.setHex(0xffe1c2);sun.intensity=2.0;sun.shadow.bias=-.00025;sun.shadow.normalBias=.025;\nscene.fog.color.setHex(0xc78d91);scene.fog.density=.0028;\nfor(const material of skinCache.values()){material.roughness=.56;material.metalness=0;material.envMapIntensity=.22;material.needsUpdate=true}\n`;
        const enhancementScript='\n;('+vcEnhancementModule.toString()+')();\n';

        const sceneReady='scene.add(jasonMesh,luciaMesh);';
        if(!html.includes(sceneReady))throw new Error('Could not find the character setup point to apply the visual treatment.');
        html=html.replace(sceneReady,()=>sceneReady+visualTune+enhancementScript);

        // Ignore keyboard auto-repeat on one-shot actions, not held movement keys.
        const keydown=/addEventListener\(['"]keydown['"]\s*,\s*e\s*=>\s*\{\s*const\s+k\s*=\s*e\.key\.toLowerCase\(\)\s*;\s*keys\[k\]\s*=\s*true\s*;/;
        if(!keydown.test(html))throw new Error('Could not locate the keyboard handler; refusing to apply an incomplete input fix.');
        html=html.replace(keydown,match=>match+'if(e.repeat)return;');

        document.open();document.write(html);document.close();
      }catch(err){
        const reason=err&&err.name==='AbortError'?'Loading timed out. Check your connection and reload.':String(err&&err.message||err);
        showBootError(reason+'\n\nRun this page from a web server (not file://), and allow access to raw.githubusercontent.com and cdnjs.cloudflare.com.');
      }
    }
    boot();
  </script>
